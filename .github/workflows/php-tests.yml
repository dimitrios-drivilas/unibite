name: PHP CI
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: security-checker

    - name: Syntax Check
      run: find . -name "*.php" -exec php -l {} \;
      
    - name: Security Risk Check
      run: |
        # Απλός έλεγχος για επικίνδυνες συναρτήσεις (π.χ. eval, exec, passthru)
        if grep -rnw '.' --include="*.php" -e 'eval(' -e 'passthru(' -e 'shell_exec('; then
          echo "Found potentially unsafe functions!"
          exit 1
        fi
